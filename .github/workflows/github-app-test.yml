name: GitHub App Integration Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

jobs:
  test-github-app-integration:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Display GitHub Context
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
      
      - name: Test GitHub App Token (if available)
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'issues' }}
        run: |
          echo "Testing GitHub App integration context"
          echo "This workflow can be triggered by a GitHub App"
          
      - name: Display Event Payload
        run: |
          echo "Event payload:"
          cat $GITHUB_EVENT_PATH
      
      - name: Success Message
        run: |
          echo "✅ GitHub App Integration test completed successfully!"
          echo "This workflow demonstrates how GitHub Apps can trigger and interact with workflows"
